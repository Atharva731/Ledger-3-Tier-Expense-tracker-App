<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ledger</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="summary">
    <div>
      <div class="label">This month</div>
      <div class="value neg" id="monthTotal">₹0</div>
    </div>
    <div>
      <div class="label">Entries</div>
      <div class="value" id="entryCount">0</div>
    </div>
    <div>
      <div class="label">Top category</div>
      <div class="value" id="topCat">—</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <form id="expenseForm">
    <div class="row">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Health</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex: 2 1 260px;">
        <label for="note">Note</label>
        <input type="text" id="note" placeholder="What was it for?">
      </div>
      <button type="submit">Add expense</button>
    </div>
  </form>

  <div class="breakdown" id="breakdownWrap" style="display:none;">
    <h2>By category</h2>
    <div id="breakdown"></div>
  </div>

  <div>
    <h2>Recent entries</h2>
    <div class="ledger" id="ledger"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
